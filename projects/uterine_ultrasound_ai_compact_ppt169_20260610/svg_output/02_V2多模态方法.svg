<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <clipPath id="figClip">
      <rect x="52" y="136" width="1176" height="414" rx="8"/>
    </clipPath>
  </defs>
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#F7FAF9"/>
    <rect x="0" y="0" width="1280" height="92" fill="#FFFFFF"/>
    <rect x="0" y="91" width="1280" height="1" fill="#A9B7B3" fill-opacity="0.55"/>
  </g>

  <g id="header">
    <text x="52" y="48" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="32" font-weight="bold" fill="#1F2933">V2 模型以图像证据为主轴，文本只在门控中补充上下文</text>
    <text x="52" y="78" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#64748B">EfficientNet-B3 + 医学 BERT + ImageDominantGatedFusion，输出正常 / 子宫内膜癌 / 息肉三类概率</text>
    <text x="1228" y="54" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" font-weight="bold" fill="#00796B">METHOD</text>
  </g>

  <g id="figure-model">
    <rect x="52" y="136" width="1176" height="414" rx="8" fill="#FFFFFF" stroke="#A9B7B3" stroke-width="1"/>
    <image href="../images/fig_model_fusion.png" x="60" y="151" width="1160" height="406" preserveAspectRatio="xMidYMid meet" clip-path="url(#figClip)"/>
  </g>

  <g id="fact-image">
    <rect x="52" y="579" width="360" height="88" rx="8" fill="#FFFFFF" stroke="#A9B7B3" stroke-width="1"/>
    <use data-icon="tabler-outline/photo" x="78" y="604" width="32" height="32" fill="#0F4D92" stroke-width="2"/>
    <text x="124" y="616" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="bold" fill="#1F2933">图像编码器</text>
    <text x="124" y="646" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#64748B">300×300 输入；EfficientNet-B3 输出 1536 维特征</text>
  </g>

  <g id="fact-text">
    <rect x="460" y="579" width="360" height="88" rx="8" fill="#FFFFFF" stroke="#A9B7B3" stroke-width="1"/>
    <use data-icon="tabler-outline/brain" x="486" y="604" width="32" height="32" fill="#00796B" stroke-width="2"/>
    <text x="532" y="616" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="bold" fill="#1F2933">医学文本编码</text>
    <text x="532" y="646" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#64748B">检查方式 + 检查所见；医学 BERT CLS 768 维</text>
  </g>

  <g id="fact-fusion">
    <rect x="868" y="579" width="360" height="88" rx="8" fill="#FFFFFF" stroke="#A9B7B3" stroke-width="1"/>
    <use data-icon="tabler-outline/database" x="894" y="604" width="32" height="32" fill="#B64342" stroke-width="2"/>
    <text x="940" y="616" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="bold" fill="#1F2933">门控融合分类</text>
    <text x="940" y="646" font-family='Consolas, monospace' font-size="13" fill="#64748B">g·image + (1-g)·text → 512→256→3</text>
  </g>

  <g id="footer">
    <text x="52" y="700" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#94A3B8">Nature-style method figure generated by Python/matplotlib from project implementation details</text>
    <text x="1228" y="700" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#94A3B8">02 / 04</text>
  </g>
</svg>
