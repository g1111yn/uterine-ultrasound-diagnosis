    <text x="984" y="294" font-family="Georgia, Microsoft YaHei, serif" font-size="40" font-weight="700" fill="#1F1E1D">200 GB</text>
    <text x="984" y="320" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8B8881">影像与报告长期增长</text>
  </g>

  <g id="deployment-flow">
