<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#00796B" />
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#F7F6F0" />

  <g id="header">
    <text x="56" y="70" font-family="Georgia, Microsoft YaHei, serif" font-size="36" font-weight="700" fill="#1F1E1D">生产部署关注模型资源、推理时延和备份恢复</text>
    <text x="56" y="108" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#6B6864">当前方案能在常规 CPU 服务器上运行，但需要明确模型权重、内存、备份和 HTTPS 配置。</text>
  </g>

  <g id="kpi-cards">
    <path fill="#FFFFFF" stroke="#D8D6CC" d="M72,158 H310 A16,16 0 0 1 326,174 V322 A16,16 0 0 1 310,338 H72 A16,16 0 0 1 56,322 V174 A16,16 0 0 1 72,158 Z" />
    
  <g transform="translate(84.0, 186.0) scale(1.5)" fill="none" stroke="#00796B" stroke-width="2">
    <path d="M5 6a1 1 0 0 1 1 -1h12a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-12a1 1 0 0 1 -1 -1l0 -12" />
    <path d="M9 9h6v6h-6l0 -6" />
