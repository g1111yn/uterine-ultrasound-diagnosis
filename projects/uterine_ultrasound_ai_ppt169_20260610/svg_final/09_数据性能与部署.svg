    <text x="542" y="512" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="15" fill="#C15F3C">systemd</text>
    <line x1="608" y1="505" x2="658" y2="505" stroke="#00796B" stroke-width="2.5" marker-end="url(#arrowHead)" />
    <path fill="#EFEDE5" d="M682,478 H730 A14,14 0 0 1 744,492 V518 A14,14 0 0 1 730,532 H682 A14,14 0 0 1 668,518 V492 A14,14 0 0 1 682,478 Z" />
    <text x="706" y="512" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="15" fill="#6B6864">Nginx</text>
    <text x="88" y="566" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#6B6864">Linux 推荐 systemd；Windows 可使用 NSSM。生产环境建议启用 HTTPS、COOKIE_SECURE 和 HSTS。</text>
  </g>

