<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F6F0" />

  <g id="header">
    <text x="56" y="70" font-family="Georgia, Microsoft YaHei, serif" font-size="36" font-weight="700" fill="#1F1E1D">权限、审计、日志和恢复构成上线后的安全网</text>
    <text x="56" y="108" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#6B6864">临床系统不仅要能推理，还要能解释“谁在何时做了什么”和“故障时如何恢复”。</text>
  </g>

  <g id="ops-matrix">
    <path fill="#FFFFFF" stroke="#D8D6CC" d="M74,154 H594 A18,18 0 0 1 612,172 V340 A18,18 0 0 1 594,358 H74 A18,18 0 0 1 56,340 V172 A18,18 0 0 1 74,154 Z" />
    <path fill="#00796B" d="M61,154 H61 A5,5 0 0 1 66,159 V353 A5,5 0 0 1 61,358 H61 A5,5 0 0 1 56,353 V159 A5,5 0 0 1 61,154 Z" />
    
  <g transform="translate(94.0, 190.0) scale(1.6666666666666667)" fill="none" stroke="#00796B" stroke-width="2">
    <path d="M11.46 20.846a12 12 0 0 1 -7.96 -14.846a12 12 0 0 0 8.5 -3a12 12 0 0 0 8.5 3a12 12 0 0 1 -.09 7.06" />
    <path d="M15 19l2 2l4 -4" />
  </g>
    <text x="154" y="216" font-family="Georgia, Microsoft YaHei, serif" font-size="28" font-weight="700" fill="#1F1E1D">认证控制</text>
    <text x="94" y="270" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#1F1E1D">bcrypt 密码哈希，HttpOnly + SameSite 会话 cookie。</text>
    <text x="94" y="304" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#6B6864">连续失败锁定，支持强制改密和管理员重置。</text>

    <path fill="#FFFFFF" stroke="#D8D6CC" d="M686,154 H1206 A18,18 0 0 1 1224,172 V340 A18,18 0 0 1 1206,358 H686 A18,18 0 0 1 668,340 V172 A18,18 0 0 1 686,154 Z" />
    <path fill="#2F7C95" d="M673,154 H673 A5,5 0 0 1 678,159 V353 A5,5 0 0 1 673,358 H673 A5,5 0 0 1 668,353 V159 A5,5 0 0 1 673,154 Z" />
    
  <g transform="translate(706.0, 190.0) scale(1.6666666666666667)" fill="none" stroke="#2F7C95" stroke-width="2">
    <path d="M9.615 20h-2.615a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v8" />
    <path d="M14 19l2 2l4 -4" />
    <path d="M9 8h4" />
    <path d="M9 12h2" />
  </g>
    <text x="766" y="216" font-family="Georgia, Microsoft YaHei, serif" font-size="28" font-weight="700" fill="#1F1E1D">审计留痕</text>
    <text x="706" y="270" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#1F1E1D">登录、登出、创建病例、用户管理全量记录。</text>
    <text x="706" y="304" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#6B6864">审计日志可检索，并支持 CSV 导出。</text>

    <path fill="#FFFFFF" stroke="#D8D6CC" d="M74,394 H594 A18,18 0 0 1 612,412 V580 A18,18 0 0 1 594,598 H74 A18,18 0 0 1 56,580 V412 A18,18 0 0 1 74,394 Z" />
    <path fill="#C15F3C" d="M61,394 H61 A5,5 0 0 1 66,399 V593 A5,5 0 0 1 61,598 H61 A5,5 0 0 1 56,593 V399 A5,5 0 0 1 61,394 Z" />
    
  <g transform="translate(94.0, 430.0) scale(1.6666666666666667)" fill="none" stroke="#C15F3C" stroke-width="2">
    <path d="M3 7a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
    <path d="M7 3v4h4" />
    <path d="M9 17l0 4" />
    <path d="M17 14l0 7" />
    <path d="M13 13l0 8" />
    <path d="M21 12l0 9" />
  </g>
    <text x="154" y="456" font-family="Georgia, Microsoft YaHei, serif" font-size="28" font-weight="700" fill="#1F1E1D">可观测性</text>
    <text x="94" y="510" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#1F1E1D">structlog JSON 输出，request_id 贯穿一次请求链路。</text>
    <text x="94" y="544" font-family="Consolas, Courier New, monospace" font-size="15" fill="#6B6864">/api/health · /api/metrics · journalctl</text>

    <path fill="#FFFFFF" stroke="#D8D6CC" d="M686,394 H1206 A18,18 0 0 1 1224,412 V580 A18,18 0 0 1 1206,598 H686 A18,18 0 0 1 668,580 V412 A18,18 0 0 1 686,394 Z" />
    <path fill="#00796B" d="M673,394 H673 A5,5 0 0 1 678,399 V593 A5,5 0 0 1 673,598 H673 A5,5 0 0 1 668,593 V399 A5,5 0 0 1 673,394 Z" />
    
  <g transform="translate(706.0, 430.0) scale(1.6666666666666667)" fill="none" stroke="#00796B" stroke-width="2">
    <path d="M4 6a8 3 0 1 0 16 0a8 3 0 1 0 -16 0" />
    <path d="M4 6v6a8 3 0 0 0 16 0v-6" />
    <path d="M4 12v6a8 3 0 0 0 16 0v-6" />
  </g>
    <text x="766" y="456" font-family="Georgia, Microsoft YaHei, serif" font-size="28" font-weight="700" fill="#1F1E1D">备份恢复</text>
    <text x="706" y="510" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#1F1E1D">SQLite .backup 与 uploads 增量 rsync 保留 30 天。</text>
    <text x="706" y="544" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#6B6864">Runbook 明确服务挂掉、锁表、磁盘满、密码丢失的预案。</text>
  </g>

