    <text x="866" y="313" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F1E1D">图像主导门控融合</text>
    <text x="812" y="358" font-family="Consolas, Courier New, monospace" font-size="15" fill="#6B6864">ImageDominantGatedFusion</text>
    <text x="812" y="386" font-family="Consolas, Courier New, monospace" font-size="15" fill="#6B6864">hidden = 256</text>
    <text x="812" y="414" font-family="Consolas, Courier New, monospace" font-size="15" fill="#6B6864">concat → 512</text>

