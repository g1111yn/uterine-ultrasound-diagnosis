<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#00796B"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#F7F6F0"/>

  <g id="header">
    <text x="56" y="70" font-family="Georgia, Microsoft YaHei, serif" font-size="36" font-weight="700" fill="#1F1E1D">结果解释与报告让 AI 输出进入可复核流程</text>
    <text x="56" y="108" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#6B6864">模型输出以风险提示和复核参考形式呈现，并保留医生判断入口。</text>
  </g>

  <g id="ribbon">
    <rect x="56" y="168" width="350" height="328" rx="18" fill="#FFFFFF" stroke="#D8D6CC"/>
    <rect x="90" y="202" width="78" height="78" rx="18" fill="#E6F3F0"/>
    <use data-icon="tabler-outline/activity-heartbeat" x="111" y="223" width="36" height="36" fill="#00796B" stroke-width="2"/>
    <text x="90" y="323" font-family="Georgia, Microsoft YaHei, serif" font-size="28" font-weight="700" fill="#1F1E1D">预测</text>
    <text x="90" y="360" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#6B6864">患者级聚合诊断</text>
    <g id="prob-bars">
      <text x="90" y="398" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#6B6864">正常</text>
      <rect x="160" y="386" width="170" height="12" rx="6" fill="#EFEDE5"/>
      <rect x="160" y="386" width="108" height="12" rx="6" fill="#3B6D11"/>
      <text x="90" y="428" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#6B6864">内膜癌</text>
      <rect x="160" y="416" width="170" height="12" rx="6" fill="#EFEDE5"/>
      <rect x="160" y="416" width="42" height="12" rx="6" fill="#A32D2D"/>
      <text x="90" y="458" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#6B6864">息肉</text>
      <rect x="160" y="446" width="170" height="12" rx="6" fill="#EFEDE5"/>
      <rect x="160" y="446" width="68" height="12" rx="6" fill="#854F0B"/>
    </g>

    <line x1="416" y1="332" x2="472" y2="332" stroke="#00796B" stroke-width="2.5" marker-end="url(#arrowHead)"/>

    <rect x="482" y="168" width="350" height="328" rx="18" fill="#FFFFFF" stroke="#D8D6CC"/>
    <rect x="516" y="202" width="78" height="78" rx="18" fill="#FCEDE8"/>
    <use data-icon="tabler-outline/brain" x="537" y="223" width="36" height="36" fill="#C15F3C" stroke-width="2"/>
    <text x="516" y="323" font-family="Georgia, Microsoft YaHei, serif" font-size="28" font-weight="700" fill="#1F1E1D">解释</text>
    <text x="516" y="360" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#6B6864">逐图预测 + Grad-CAM</text>
    <rect x="516" y="388" width="96" height="70" rx="12" fill="#EFEDE5" stroke="#D8D6CC"/>
    <path d="M542 430 C552 400, 586 400, 594 430" fill="none" stroke="#C15F3C" stroke-width="3"/>
    <circle cx="568" cy="425" r="12" fill="#C15F3C" fill-opacity="0.28"/>
    <rect x="636" y="388" width="150" height="18" rx="9" fill="#E6F3F0"/>
    <rect x="636" y="420" width="110" height="18" rx="9" fill="#FCEDE8"/>
    <rect x="636" y="452" width="132" height="18" rx="9" fill="#E6F1FB"/>

    <line x1="842" y1="332" x2="898" y2="332" stroke="#00796B" stroke-width="2.5" marker-end="url(#arrowHead)"/>

    <rect x="908" y="168" width="316" height="328" rx="18" fill="#FFFFFF" stroke="#D8D6CC"/>
    <rect x="942" y="202" width="78" height="78" rx="18" fill="#E6F1FB"/>
    <use data-icon="tabler-outline/report-medical" x="963" y="223" width="36" height="36" fill="#2F7C95" stroke-width="2"/>
    <text x="942" y="323" font-family="Georgia, Microsoft YaHei, serif" font-size="28" font-weight="700" fill="#1F1E1D">报告</text>
    <text x="942" y="360" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#6B6864">中文 PDF 诊断报告</text>
    <rect x="942" y="392" width="214" height="80" rx="12" fill="#F7F6F0" stroke="#D8D6CC"/>
    <use data-icon="tabler-outline/file-report" x="966" y="416" width="32" height="32" fill="#2F7C95" stroke-width="2"/>
    <text x="1012" y="434" font-family="Consolas, Courier New, monospace" font-size="14" fill="#6B6864">report.pdf</text>
    <text x="1012" y="458" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#6B6864">归档 / 沟通 / 复核</text>
  </g>

  <g id="review-principle">
    <rect x="162" y="548" width="956" height="58" rx="18" fill="#FFFFFF" stroke="#D8D6CC"/>
    <use data-icon="tabler-outline/medical-cross" x="196" y="564" width="28" height="28" fill="#00796B" stroke-width="2"/>
    <text x="244" y="584" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#1F1E1D">医生判断、病理结果和临床流程仍是最终依据；AI 输出只作为复核参考。</text>
  </g>

  <g id="footer">
    <text x="56" y="680" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B8881">Source: Grad-CAM and report_pdf services</text>
    <text x="1224" y="680" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#8B8881">07 / 12</text>
  </g>
</svg>
