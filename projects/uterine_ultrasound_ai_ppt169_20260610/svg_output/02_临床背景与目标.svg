<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#00796B"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#F7F6F0"/>

  <g id="header">
    <text x="56" y="70" font-family="Georgia, Microsoft YaHei, serif" font-size="36" font-weight="700" fill="#1F1E1D">从单张影像判断，走向患者级辅助决策</text>
    <text x="56" y="106" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#6B6864">系统目标不是替代医生，而是把多图、多文本、可解释和可追溯能力接入真实超声流程。</text>
  </g>

  <g id="takeaway">
    <rect x="56" y="128" width="1168" height="54" rx="14" fill="#E6F3F0" stroke="#D8D6CC"/>
    <use data-icon="tabler-outline/target" x="78" y="143" width="24" height="24" fill="#00796B" stroke-width="2"/>
    <text x="116" y="162" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#1F1E1D">把 AI 输出定位为“预测概率 + 风险提示 + 复核参考”，服务医生最终判断。</text>
  </g>

  <g id="clinical-reality">
    <rect x="56" y="222" width="548" height="354" rx="16" fill="#FFFFFF" stroke="#D8D6CC"/>
    <rect x="56" y="222" width="548" height="64" rx="16" fill="#EFEDE5"/>
    <text x="88" y="263" font-family="Georgia, Microsoft YaHei, serif" font-size="26" font-weight="700" fill="#1F1E1D">临床现实</text>
    <use data-icon="tabler-outline/stethoscope" x="532" y="240" width="28" height="28" fill="#00796B" stroke-width="2"/>

    <g id="left-point-1">
      <circle cx="96" cy="336" r="17" fill="#E6F3F0"/>
      <text x="96" y="343" text-anchor="middle" font-family="Georgia, Microsoft YaHei, serif" font-size="18" font-weight="700" fill="#00796B">1</text>
      <text x="128" y="334" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F1E1D">多张切面共同构成判断依据</text>
      <text x="128" y="363" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#6B6864">一个患者通常包含多张超声图像，而非单图结论。</text>
    </g>

    <g id="left-point-2">
      <circle cx="96" cy="428" r="17" fill="#E6F3F0"/>
      <text x="96" y="435" text-anchor="middle" font-family="Georgia, Microsoft YaHei, serif" font-size="18" font-weight="700" fill="#00796B">2</text>
      <text x="128" y="426" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F1E1D">检查文字承载上下文</text>
      <text x="128" y="455" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#6B6864">检查方式与检查所见共同影响临床解释。</text>
    </g>

    <g id="left-point-3">
      <circle cx="96" cy="520" r="17" fill="#E6F3F0"/>
      <text x="96" y="527" text-anchor="middle" font-family="Georgia, Microsoft YaHei, serif" font-size="18" font-weight="700" fill="#00796B">3</text>
      <text x="128" y="518" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F1E1D">结果需要可复核与可追溯</text>
      <text x="128" y="547" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#6B6864">热力图、报告和历史记录是进入流程的关键。</text>
    </g>
  </g>

  <g id="system-goals">
    <rect x="676" y="222" width="548" height="354" rx="16" fill="#FFFFFF" stroke="#D8D6CC"/>
    <rect x="676" y="222" width="548" height="64" rx="16" fill="#FCEDE8"/>
    <text x="708" y="263" font-family="Georgia, Microsoft YaHei, serif" font-size="26" font-weight="700" fill="#1F1E1D">系统目标</text>
    <use data-icon="tabler-outline/route" x="1152" y="240" width="28" height="28" fill="#C15F3C" stroke-width="2"/>

    <g id="goal-flow">
      <rect x="724" y="330" width="142" height="64" rx="14" fill="#E6F3F0" stroke="#D8D6CC"/>
      <text x="795" y="369" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#00796B">输入</text>
      <line x1="874" y1="362" x2="938" y2="362" stroke="#00796B" stroke-width="2.5" marker-end="url(#arrowHead)"/>
      <rect x="948" y="330" width="142" height="64" rx="14" fill="#E6F1FB" stroke="#D8D6CC"/>
      <text x="1019" y="369" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#2F7C95">推理</text>
      <line x1="1019" y1="402" x2="1019" y2="456" stroke="#00796B" stroke-width="2.5" marker-end="url(#arrowHead)"/>
      <rect x="948" y="466" width="142" height="64" rx="14" fill="#FCEDE8" stroke="#D8D6CC"/>
      <text x="1019" y="505" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#C15F3C">复核</text>
      <line x1="938" y1="498" x2="874" y2="498" stroke="#00796B" stroke-width="2.5" marker-end="url(#arrowHead)"/>
      <rect x="724" y="466" width="142" height="64" rx="14" fill="#FFFFFF" stroke="#D8D6CC"/>
      <text x="795" y="505" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F1E1D">归档</text>
    </g>
  </g>

  <g id="footer">
    <text x="56" y="680" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#8B8881">Source: project README and local codebase analysis</text>
    <text x="1224" y="680" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12" fill="#8B8881">02 / 12</text>
  </g>
</svg>
